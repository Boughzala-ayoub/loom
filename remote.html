<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#121a2d" />
    <title>Loom</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <!-- The phone app (src/remote.ts), served by loom.exe (remote.rs). Styles: src/remote.css. -->
  </head>
  <body>
    <div id="offline" role="alert" hidden></div>
    <section id="pairing" hidden>
      <form>
        <img src="/icon.svg" alt="" />
        <h1>Pair this phone</h1>
        <p class="hint">On the PC, run <code>loomctl remote pair</code> in any Loom terminal, then type the code it shows. It works for ten minutes.</p>
        <label class="field">Pairing code <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required /></label>
        <button class="primary">Pair</button>
      </form>
    </section>
    <div id="app" hidden>
      <nav id="tabs" aria-label="Loom"></nav>
    </div>
    <div id="scrim" hidden></div>
    <div id="sheet" role="dialog" aria-modal="true" hidden></div>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/remote.ts"></script>
  </body>
</html>
